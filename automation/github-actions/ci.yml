name: Verify

on:
  push:
    branches:
      - main
      - arena/019feffa-mlb-pbp
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q mlb_pbp
      - name: Check browser JavaScript syntax
        run: |
          node --check docs/js/api.js
          node --check docs/js/format.js
          node --check docs/js/app.js
      - name: Check CLI help
        run: python -m mlb_pbp --help
